[workspace]
authors = ["Sergey Mikhno <sergey.mikhno@gmail.com>"]
channels = ["conda-forge"]
name = "segmentation"
platforms = ["linux-64", "osx-arm64"]
version = "0.2.0"

[tasks]
web = "python app.py"
start-server = { cmd = "uvicorn ocr_reflow.server:app --host 0.0.0.0 --port 8000 &", cwd = "src" }
stop-server = "pkill -f 'uvicorn ocr_reflow.server:app' || true"
restart-server = { depends-on = ["stop-server", "start-server"] }
ocr-export = { cmd = "python ocr_reflow/ocr_export.py", cwd = "src" }

[dependencies]
python = "3.12.*"
numpy = ">=2.3.5,<3"
djvulibre = ">=3.5.28,<4"
cython = ">=3.0,<4"
scipy = ">=1.16.3,<2"
matplotlib = ">=3.10.8,<4"
jupyterlab = ">=4.5.0,<5"
ipywidgets = ">=8.1.8,<9"
shapely = ">=2.1.2,<3"
black = ">=25.1.0,<26"
pip = ">=25.3,<26"
networkx = ">=3.6.1,<4"
pixi-pycharm = ">=0.0.10,<0.0.11"
flask = ">=3.1.0,<4"
transformers = ">=5.2.0,<6"
sentencepiece = ">=0.2.0,<1"
lxml = ">=5.3.0,<6"
huggingface_hub = ">=1.4,<2"

[pypi-dependencies]
python-doctr = ">=1.0.0, <2"
opencv-python = ">=4.11.0.86, <5"
doclayout-yolo = ">=0.0.4, <0.0.5"
pymupdf = ">=1.23.0, <2"
python-djvulibre = { git = "https://github.com/ssppkenny/python-djvulibre" }
fastapi = ">=0.110,<1"
uvicorn = { version = ">=0.29,<1", extras = ["standard"] }
python-multipart = ">=0.0.9,<1"
pix2tex = ">=0.1.4,<0.2"
datastar-py = ">=1.0.0"
markdown = ">=3.6,<4"
playwright = ">=1.40,<2"
fasttext = ">=0.9.2,<1"

# CPU-only environment (default, works on all platforms)
[feature.cpu.dependencies]
pytorch = ">=2.9.1,<3"
torchvision = ">=0.19,<1"

# GPU environment with CUDA support (Linux only)
[feature.gpu.dependencies]

# Platform-specific GPU dependencies (only for Linux)
[feature.gpu.target.linux-64.dependencies]
pytorch = { version = ">=2.9.1,<3", build = "*cuda*" }
torchvision = { version = ">=0.19,<1", build = "*cuda*" }

[feature.gpu.system-requirements]
cuda = "12"

# Define environments
# default uses CPU (works on all platforms including macOS)
# gpu environment for Linux with CUDA
[environments]
default = ["gpu"]
gpu = ["gpu"]
cpu = ["cpu"]

