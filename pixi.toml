[workspace]
authors = ["Sergey Mikhno <sergey.mikhno@gmail.com>"]
channels = ["conda-forge"]
name = "segmentation"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
numpy = ">=2.3.5,<3"
scipy = ">=1.16.3,<2"
matplotlib = ">=3.10.8,<4"
jupyterlab = ">=4.5.0,<5"
ipywidgets = ">=8.1.8,<9"
shapely = ">=2.1.2,<3"
black = ">=25.1.0,<26"
pip = ">=25.3,<26"
networkx = ">=3.6.1,<4"

[pypi-dependencies]
python-doctr = ">=1.0.0, <2"
opencv-python = ">=4.11.0.86, <5"
doclayout-yolo = ">=0.0.4, <0.0.5"

# CPU-only environment (default, works on all platforms)
[feature.cpu.dependencies]
pytorch = ">=2.9.1,<3"
torchvision = ">=0.19,<1"

# GPU environment with CUDA support (Linux only)
[feature.gpu.dependencies]

# Platform-specific GPU dependencies (only for Linux)
[feature.gpu.target.linux-64.dependencies]
pytorch = { version = ">=2.9.1,<3", build = "*cuda*" }
torchvision = { version = ">=0.19,<1", build = "*cuda*" }

[feature.gpu.system-requirements]
cuda = "12"

# Define environments
# default uses CPU (works on all platforms including macOS)
# gpu environment for Linux with CUDA
[environments]
default = ["cpu"]
gpu = ["gpu"]
cpu = ["cpu"]

